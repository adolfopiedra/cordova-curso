name: cordova-curso
services:
  cordova:
    build: .
    platform: linux/amd64
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm
      - gradle-cache:/root/.gradle
      - android-state:/root/.android
volumes:
  npm-cache:
  gradle-cache:
  android-state:
